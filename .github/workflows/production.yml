
name: Horror production

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'story_pack, receive_clip or render'
        required: true
        default: 'story_pack'
        type: choice
        options:
          - story_pack
          - receive_clip
          - render

      job_id:
        description: 'Drive INBOX job folder name'
        required: true
        type: string

      topic_title:
        description: 'Approved topic'
        required: false
        type: string

      format:
        description: 'short or long'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long

      telegram_file_id:
        description: 'Telegram video file ID'
        required: false
        type: string

      scene_number:
        description: 'Scene number'
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        if: inputs.action == 'render'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create story and Flow prompt pack
        if: inputs.action == 'story_pack'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          JOB_ID: ${{ inputs.job_id }}
          TOPIC_TITLE: ${{ inputs.topic_title }}
          FORMAT: ${{ inputs.format }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/create_story_pack.py

      - name: Receive individual Telegram clip
        id: receive
        if: inputs.action == 'receive_clip'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          TELEGRAM_FILE_ID: ${{ inputs.telegram_file_id }}
          SCENE_NUMBER: ${{ inputs.scene_number }}
          FORMAT: ${{ inputs.format }}
        run: PYTHONPATH=. python scripts/receive_telegram_clip.py

      - name: Start rendering automatically after all clips arrive
        if: inputs.action == 'receive_clip' && steps.receive.outputs.all_clips == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_FORMAT: ${{ inputs.format }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = (
              f"https://api.github.com/repos/"
              f"{os.environ['GH_REPOSITORY']}/actions/workflows/"
              f"production.yml/dispatches"
          )

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              json={
                  "ref": os.environ["GH_REF"],
                  "inputs": {
                      "action": "render",
                      "job_id": os.environ["JOB_ID"],
                      "format": os.environ["VIDEO_FORMAT"],
                  },
              },
              timeout=30,
          )

          response.raise_for_status()
          print("All clips received. Rendering workflow dispatched.")
          PY

      - name: Render video from Drive clips
        id: render
        if: inputs.action == 'render'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
        run: |
          mkdir -p work
          python -m src.render "${{ inputs.job_id }}" | tee work/render-result.json

      - name: Upload video to YouTube
        if: inputs.action == 'render' && steps.render.outcome == 'success'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
        run: |
          python - <<'PY'
          import json
          from src.youtube import main

          result = json.load(open("work/render-result.json", encoding="utf-8"))

          if result.get("publish"):
              url = main("work/final.mp4", "work/manifest.json")
              with open("work/youtube-result.json", "w", encoding="utf-8") as f:
                  json.dump({"youtube_url": url}, f)
          else:
              print("YouTube upload skipped: manifest publish is false.")
          PY

      - name: Send finished video to Telegram
        if: always() && inputs.action == 'render' && steps.render.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.notify_telegram

      - name: Save render metadata
        if: always() && inputs.action == 'render'
        uses: actions/upload-artifact@v4
        with:
          name: horror-${{ inputs.job_id }}-metadata
          path: work/
          if-no-files-found: ignore
